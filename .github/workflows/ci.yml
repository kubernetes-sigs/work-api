name: CI Workflow
on:
  # Run this workflow every time a new commit pushed to upstream/fork repository.
  # Run workflow on fork repository will help contributors find and resolve issues before sending a PR.
  push:
  pull_request:
defaults:
  run:
    working-directory: go/src/sigs.k8s.io/work-api

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.8
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # the version of golangci-lint.
          version: v2.8.0

          # show only new issues if it's a pull request.
          only-new-issues: false
          args: --timeout 5m0s
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: go/src/sigs.k8s.io/work-api
      - name: install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.8
          cache-dependency-path: go/src/sigs.k8s.io/work-api/go.sum
      - name: verify
        run: hack/verify-all.sh -v
        env:
          GOPATH: '/home/runner/work/work-api/work-api/go'
  test:
    name: unit test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: go/src/sigs.k8s.io/work-api
      - name: install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.8
          cache-dependency-path: go/src/sigs.k8s.io/work-api/go.sum
      - name: make test
        run: make test
        env:
          GOPATH: '/home/runner/work/work-api/work-api/go'
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: go/src/sigs.k8s.io/work-api
      - name: install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.8
          cache-dependency-path: go/src/sigs.k8s.io/work-api/go.sum
      - name: images
        run: make docker-build
        env:
          GOPATH: '/home/runner/work/work-api/work-api/go'
      - name: setup kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          cluster_name: kind
          wait: 300s
          kubectl_version: v1.35.0
      - name: Load image on the nodes of the cluster
        run: |
          kind load docker-image --name=kind work-api-controller:latest
      - name: Run e2e test
        run: |
          make test-e2e
        env:
          KUBECONFIG: /home/runner/.kube/config
